<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mi Lana</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Lana">
<meta name="theme-color" content="#E4007C">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app de una columna tipo teléfono; tarjeta héroe rosa mexicano con "lo que puedes gastar", pestañas abajo y botón + flotante */
:root{
  --bg:#FFF5EC; --surface:#FFFFFF; --surface-2:#FFEADB; --ink:#2B1A2F; --muted:#806C79; --line:#F2DDD0;
  --rosa:#E4007C; --rosa-ink:#E4007C; --rosa-soft:#FFE0F0; --mango:#FF9F1C; --turq:#00A3A3; --lima:#6DB31E; --cobalto:#3B5BDB; --lila:#9B5DE5; --deuda:#D92D4A;
  --ok:#17935A; --warn:#D98200; --bad:#D92D4A; --bad-soft:#FFE3E8; --ok-soft:#DDF5E8;
  --on-accent:#FFFFFF; --hero:#E4007C; --hero-a:#FF9F1C; --hero-b:#00A3A3; --hero-over:#B3123A; --hero-over-a:#FF7A45; --hero-over-b:#6B1B5E;
  --shadow:0 10px 30px -12px rgba(120,20,70,.25);
  --f-display:"Montserrat",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1120; --surface:#261A2D; --surface-2:#33243C; --ink:#FBEFF6; --muted:#BBA5B5; --line:#3E2D47;
  --rosa:#FF2E97; --rosa-ink:#FF2E97; --rosa-soft:#4A1C38; --mango:#FFB347; --turq:#2CC9C9; --lima:#93D945; --cobalto:#7690FF; --lila:#B07CF0; --deuda:#FF5C77;
  --ok:#3BCB86; --warn:#FFB020; --bad:#FF5C77; --bad-soft:#4A1F2A; --ok-soft:#173B2A;
  --on-accent:#FFFFFF; --hero:#FF2E97; --hero-a:#FFB347; --hero-b:#2CC9C9; --hero-over:#B3123A; --hero-over-a:#FF7A45; --hero-over-b:#6B1B5E;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1120; --surface:#261A2D; --surface-2:#33243C; --ink:#FBEFF6; --muted:#BBA5B5; --line:#3E2D47;
  --rosa:#FF2E97; --rosa-ink:#FF2E97; --rosa-soft:#4A1C38; --mango:#FFB347; --turq:#2CC9C9; --lima:#93D945; --cobalto:#7690FF; --lila:#B07CF0; --deuda:#FF5C77;
  --ok:#3BCB86; --warn:#FFB020; --bad:#FF5C77; --bad-soft:#4A1F2A; --ok-soft:#173B2A;
  --on-accent:#FFFFFF; --hero:#FF2E97; --hero-a:#FFB347; --hero-b:#2CC9C9; --hero-over:#B3123A; --hero-over-a:#FF7A45; --hero-over-b:#6B1B5E;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}

/* la app solo se desliza para arriba y abajo: nada de moverse a los lados ni hacer zoom */
html{touch-action:pan-y;overflow-x:hidden;width:100%;max-width:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  touch-action:pan-y;overflow-x:clip;width:100%;max-width:100%;position:relative;overscroll-behavior:none;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
input,select{font-size:16px} /* evita el zoom automático al escribir en iPhone */
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--mango);outline-offset:2px;border-radius:10px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;overflow-x:clip;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px calc(110px + env(safe-area-inset-bottom,0px))}

/* header */
.top{min-width:0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px}
.brand{min-width:0;flex:0 1 auto;font-family:var(--f-display);font-weight:800;font-size:clamp(21px,6vw,26px);white-space:nowrap;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand .logo{flex:none;width:34px;height:34px;border-radius:10px;display:block}
.brand i{flex:none;width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--rosa) 0 35%,var(--mango) 0 60%,var(--turq) 0 82%,var(--lima) 0);display:inline-block}
.month{flex:none;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.month b{font-weight:600;font-size:14px;min-width:72px;white-space:nowrap;text-align:center;text-transform:capitalize}
.month button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.month button:active{background:var(--surface-2)}

.stack{display:flex;flex-direction:column;gap:14px}
.h2{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;margin:8px 0 0;text-wrap:balance}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}
.muted{color:var(--muted)}

/* demo */
.demo{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface-2);border:1.5px dashed var(--mango);border-radius:18px;padding:12px 14px;font-size:14px}
.demo strong{display:block}
.btn{white-space:nowrap;flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px}
.btn.pri{background:var(--rosa);color:var(--on-accent)}
.btn.sec{background:var(--surface);border:1px solid var(--line)}
.btn.ghost{color:var(--rosa-ink);padding-inline:8px}
.btn:active{transform:scale(.97)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px 20px 20px;color:var(--on-accent);background:var(--hero);box-shadow:var(--shadow);isolation:isolate}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;z-index:-1}
.hero::before{width:220px;height:220px;right:-70px;top:-90px;background:var(--hero-a);opacity:.9}
.hero::after{width:150px;height:150px;right:40px;bottom:-95px;background:var(--hero-b);opacity:.85}
.hero.over{background:var(--hero-over)}
.hero.over::before{background:var(--hero-over-a)}.hero.over::after{background:var(--hero-over-b)}
.hero .lbl{color:var(--on-accent);opacity:.85}
.hero .edit + .lbl{padding-right:140px}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:clamp(42px,13vw,58px);line-height:1;letter-spacing:-.03em;margin:8px 0 6px;font-variant-numeric:tabular-nums}
.hero .sub{font-size:14.5px;opacity:.95;max-width:30ch}
.hero .pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.hero .pill{background:rgba(255,255,255,.2);backdrop-filter:blur(6px);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.hero .edit{position:absolute;right:14px;top:14px;background:rgba(255,255,255,.25);color:var(--on-accent);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;min-width:0}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}

/* barra del mes */
.bar{height:16px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex}
.bar span{height:100%;transition:width .5s ease}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px}
.legend div{display:flex;align-items:center;gap:6px}

/* categorías */
.cat-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:14px}
.cat-row .track{height:9px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.cat-row .track span{display:block;height:100%;border-radius:999px}
.cat-row b{font-variant-numeric:tabular-nums;font-weight:600}
.ico{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:17px;flex:none}

/* listas */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12.5px;color:var(--muted)}
.item .amt{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--ok)}
.day-h{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:capitalize;margin:14px 0 2px;display:flex;justify-content:space-between}

.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.late{background:var(--bad-soft);color:var(--bad)}
.chip.soon{background:var(--surface-2);color:var(--warn)}
.chip.idle{background:var(--surface-2);color:var(--muted)}
.chip.btnchip{border:1.5px solid var(--rosa-ink);color:var(--rosa-ink);background:transparent}

.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* deudas */
.debt{display:flex;flex-direction:column;gap:10px}
.debt-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.debt-head .t{font-family:var(--f-display);font-weight:700;font-size:18px}
.prog{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex;gap:2px}
.prog span{flex:1;background:var(--line)}
.prog span.done{background:var(--turq)}
.prog span.now{background:var(--rosa)}
.prog.long{gap:0}.prog.long span{flex:none}
.debt-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:12.5px}
.debt-meta b{display:block;font-family:var(--f-display);font-size:15.5px;font-variant-numeric:tabular-nums}
.free{display:flex;flex-direction:column;gap:0}
.free .row{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.free .row:last-child{border-bottom:0}
.free .when{font-family:var(--f-display);font-weight:700;text-transform:capitalize;font-size:14px;line-height:1.1}
.free .gain{color:var(--ok);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.sum-strip{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}

.empty{text-align:center;padding:26px 16px;color:var(--muted)}
.empty .em{font-size:36px;display:block;margin-bottom:6px}
.empty p{margin:4px 0 14px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.nav-in{pointer-events:auto;max-width:560px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 66px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);height:66px;padding:0 6px}
.nav-in button.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;min-width:0;overflow:hidden;white-space:nowrap;font-weight:600;color:var(--muted);padding:6px 0}
.nav-in button.tab svg{width:23px;height:23px}
.nav-in button.tab.on{color:var(--rosa-ink)}
.fab{justify-self:center;width:60px;height:60px;border-radius:22px;background:var(--rosa);color:var(--on-accent);display:grid;place-items:center;transform:translateY(-14px);box-shadow:0 12px 24px -8px var(--rosa)}
.fab svg{width:28px;height:28px}
.fab:active{transform:translateY(-14px) scale(.94)}

/* sheet */
.veil{position:fixed;inset:0;z-index:40;background:rgba(30,10,30,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.veil.show{opacity:1}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));transform:translateY(30px);transition:transform .25s ease}
.veil.show .sheet{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-family:var(--f-display);font-weight:800;font-size:22px;margin:0 0 14px}
.f{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span{font-size:13px;font-weight:600;color:var(--muted)}
.fld input,.fld select{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;min-width:0}
.fld input[type=date]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-height:48px;text-align:left}
.fld input::-webkit-date-and-time-value{text-align:left}
.item .chip{flex:none}
.item .acts{display:flex;gap:6px;align-items:center;flex:none}
.sw{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.sw input{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;margin:0;cursor:pointer}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked{background:var(--turq)}
.sw input:checked::after{transform:translateX(18px)}
.sw b{display:block;font-weight:700}
.sw small{display:block;color:var(--muted);font-size:12.5px}
.chip.auto{background:color-mix(in srgb,var(--turq) 16%,var(--surface));color:var(--turq)}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--rosa-ink)}
.fld .big-in{font-family:var(--f-display);font-weight:800;font-size:34px;padding:10px 14px;letter-spacing:-.02em}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.seg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--surface-2);border-radius:16px;padding:4px}
.seg button{padding:10px;border-radius:12px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px -4px rgba(0,0,0,.25)}
.seg button.on[data-tipo="gasto"]{color:var(--rosa-ink)}
.seg button.on[data-tipo="ingreso"]{color:var(--ok)}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats button{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-size:14px;font-weight:600}
.cats button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:6px}
.actions .btn.pri{flex:1;padding:14px}
.btn.del{color:var(--bad);background:var(--bad-soft)}
.hint{font-size:13px;color:var(--muted);margin:-6px 0 0}
.err{color:var(--bad);font-size:13px;font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.note{font-size:12.5px;color:var(--muted);text-align:center;padding:6px 0}
.loading{text-align:center;padding:70px 0;color:var(--muted)}
.loading i{display:inline-block;width:56px;height:56px;border-radius:16px;background:url(logo.svg) center/cover;animation:bob 1.1s ease-in-out infinite;margin-bottom:10px}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
@keyframes spin{to{transform:rotate(1turn)}}
.who{width:36px;height:36px;border-radius:50%;background:var(--lila);color:var(--on-accent);font-family:var(--f-display);font-weight:800;font-size:16px;display:grid;place-items:center;flex:none}
.top-r{display:flex;align-items:center;gap:8px}
.prof-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.prof{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;background:var(--surface);border:1px solid var(--line);border-radius:22px;font-weight:700}
.prof .who{width:58px;height:58px;font-size:24px}
.prof.new{border-style:dashed;color:var(--rosa-ink)}
.pin-in{letter-spacing:.5em;text-align:center}
.nav .l-short{display:none}
@media (max-width:400px){.nav .l-long{display:none}.nav .l-short{display:inline}}
.saved{background:color-mix(in srgb,var(--lila) 14%,var(--surface));border-color:color-mix(in srgb,var(--lila) 35%,var(--line))}
.saved .big{font-family:var(--f-display);font-weight:800;font-size:clamp(36px,11vw,48px);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.meta{display:flex;flex-direction:column;gap:10px}
.meta .t{font-family:var(--f-display);font-weight:700;font-size:18px}
.meta-acts{display:flex;gap:8px;flex-wrap:wrap}
.amt.sv{color:var(--lila)}
.i{width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle}
.chip .i,.btn .i{width:14px;height:14px;margin:-2px 0}
.cats button .i{width:17px;height:17px}
.ycol .flag .i{width:14px;height:14px;color:var(--ok)}
.empty .em{width:58px;height:58px;border-radius:18px;background:var(--rosa-soft);color:var(--rosa);display:grid;place-items:center;margin:0 auto 10px}
.empty .em .i{width:28px;height:28px}
.grp-h{display:flex;align-items:center;gap:10px;margin:8px 2px 2px}
.grp-h .ico{width:30px;height:30px;border-radius:10px}
.grp-h .ico .i{width:17px;height:17px}
.grp-h b{font-family:var(--f-display);font-size:16px;flex:1}
.grp-h span.v{font-weight:700;font-variant-numeric:tabular-nums}
.paying .i{width:14px;height:14px;margin-right:2px}
/* vista anual */
.scope{max-width:260px}
.ychart{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px;align-items:end;height:190px;margin-top:14px}
.ycol{display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;min-width:0}
.ycol .flag{height:18px;font-size:13px;line-height:18px}
.ycol .stk{flex:1;width:100%;display:flex;flex-direction:column-reverse;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.ycol .stk span{display:block;width:100%}
.ycol.cur .stk{outline:2.5px solid var(--rosa-ink);outline-offset:1.5px}
.ycol .m{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:capitalize}
.ycol.cur .m{color:var(--rosa-ink)}
.etapa{position:relative;border-radius:22px;padding:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.etapa .rng{font-family:var(--f-display);font-weight:700;font-size:15px}
.etapa .lib{font-family:var(--f-display);font-weight:800;font-size:32px;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.etapa .lib small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.etapa.libre{background:color-mix(in srgb,var(--lima) 16%,var(--surface));border-color:color-mix(in srgb,var(--lima) 45%,var(--line))}
.etapa.neg .lib{color:var(--bad)}
.paying{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.paying span{font-size:12.5px;font-weight:600;background:var(--surface-2);border-radius:999px;padding:4px 10px}
.salto{display:flex;gap:10px;align-items:center;padding:4px 8px 4px 14px;font-size:14px}
.salto .ar{width:30px;height:30px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;flex:none;font-weight:800}
.salto b{color:var(--ok)}
.mrow{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .mn{font-weight:700;text-transform:capitalize;font-size:14px}
.mrow.cur .mn{color:var(--rosa-ink)}
.mrow .ev{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.mrow .v{text-align:right;font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.mrow .v small{display:block;font-family:var(--f-body);font-weight:500;font-size:11.5px;color:var(--muted)}
/* reporte */
.rep-acts{display:flex;gap:8px;flex-wrap:wrap}
.rep-h{display:flex;align-items:center;gap:12px}
.rep-h img{width:46px;height:46px;border-radius:14px}
.rep-h .t{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.15;text-wrap:balance}
.rep-h .s{color:var(--muted);font-size:13px}
.rl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.rl:last-child{border-bottom:0}
.rl .n{min-width:0}
.rl .n small{display:block;color:var(--muted);font-size:12px}
.rl .m{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.rl.tot{border-top:2px solid var(--ink);border-bottom:0;margin-top:4px;padding-top:10px;font-size:15px}
.rl.tot .n,.rl.tot .m{font-weight:800}
.res .rl .m{font-weight:800}
.rl.sub{border-bottom-color:transparent;padding-top:14px}
.rl.sub .n{font-weight:800;color:var(--ink);font-size:14px}
.rl.sub .m{font-weight:800}
.rep-sec h3{font-family:var(--f-display);font-weight:800;font-size:17px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.rep-sec h3 .i{width:18px;height:18px}
.st{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:6px;white-space:nowrap}
.st.ok{background:var(--ok-soft);color:var(--ok)}.st.pend{background:var(--surface-2);color:var(--warn)}.st.au{background:color-mix(in srgb,var(--turq) 16%,var(--surface));color:var(--turq)}
.res{border-radius:24px;padding:18px;background:var(--surface);border:2px solid var(--ink)}
.res .big{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,9vw,40px);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
@media print{
  .nav,.toast,.no-print,.top,.demo,.note,body::before{display:none!important}
  html,body{background:#fff!important}
  .app{max-width:none;padding:0!important}
  .card,.res,.rep-sec{break-inside:avoid;box-shadow:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:370px){.brand span{display:none}.month b{min-width:64px;font-size:13px}.month button{width:28px}.hero .edit + .lbl{padding-right:0;margin-top:30px}}
@media (max-width:380px){.stats{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.stats .stat:last-child{grid-column:span 2}}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
.veil,.sheet,.nav{touch-action:pan-y;overscroll-behavior:contain}
.sheet{overflow-x:hidden}
img,svg{max-width:100%}

<script>
/* ---------- sin zoom en el teléfono ---------- */
(function(){
  const stop=e=>e.preventDefault();
  document.addEventListener('gesturestart',stop,{passive:false});
  document.addEventListener('gesturechange',stop,{passive:false});
  document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
  let last=0;
  document.addEventListener('touchend',e=>{
    const now=Date.now();
    if(now-last<320 && !e.target.closest('button,input,select,label,a')) e.preventDefault();
    last=now;
  },{passive:false});
  document.addEventListener('dblclick',stop,{passive:false});
  let x0=0,y0=0;
  document.addEventListener('touchstart',e=>{if(e.touches.length===1){x0=e.touches[0].clientX;y0=e.touches[0].clientY}},{passive:true});
  document.addEventListener('touchmove',e=>{if(e.touches.length!==1)return;const dx=Math.abs(e.touches[0].clientX-x0),dy=Math.abs(e.touches[0].clientY-y0);if(dx>dy&&dx>6&&e.cancelable)e.preventDefault()},{passive:false});
})();

/* ---------- utilidades ---------- */
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoy=()=>iso(new Date());
const curYM=()=>hoy().slice(0,7);
const addM=(ym,n)=>{let[y,m]=ym.split('-').map(Number);m+=n-1;y+=Math.floor(m/12);m=((m%12)+12)%12+1;return y+'-'+pad(m)};
const daysIn=ym=>{const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()};
const mesL=(ym,corto)=>{const[y,m]=ym.split('-').map(Number);const n=MESES[m-1];return corto?n.slice(0,3)+' '+String(y).slice(2):n+' '+y};
const fechaEn=(ym,dia)=>ym+'-'+pad(Math.min(Math.max(1,dia|0||1),daysIn(ym)));
const fmt=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});
const fmt2=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:0,maximumFractionDigits:2});
const $m=n=>fmt.format(Math.round(n||0));
const $m2=n=>fmt2.format(n||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sum=a=>a.reduce((t,x)=>t+(+x.monto||+x.cuota||0),0);
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.]/g,''));return isFinite(n)?n:0};

/* íconos de línea propios (en lugar de emojis) */
const IC={
  comida:'<path d="M7 3v18M4.5 3v4.5a2.5 2.5 0 0 0 5 0V3M17.5 21V3c-2.2 0-3.5 2.3-3.5 5.5S15 13 17.5 13"/>',
  super:'<path d="M3 4h2.2l2.3 10.2a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L20 7H6"/><circle cx="9.5" cy="19.5" r="1.5"/><circle cx="16.5" cy="19.5" r="1.5"/>',
  auto:'<path d="M4 16v-3.5L6.2 7h11.6l2.2 5.5V16a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1zM4 12.5h16"/><circle cx="8" cy="17.5" r="1.6"/><circle cx="16" cy="17.5" r="1.6"/>',
  casa:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  salud:'<path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/><path d="M8 12h2.2l1.2-2 1.6 4 1.2-2H16"/>',
  antojo:'<path d="M5 9h11.5v4.5A5.5 5.5 0 0 1 11 19h-.5A5.5 5.5 0 0 1 5 13.5zM16.5 10.5h1.2a2.3 2.3 0 0 1 0 4.6h-1.5M8.5 3.5v2.5M12.5 3.5v2.5"/>',
  ropa:'<path d="M8.5 3.5 3.5 6.5l2 4 2.5-1V20h8V9.5l2.5 1 2-4-5-3a3.6 3.6 0 0 1-7 0z"/>',
  ocio:'<path d="M3 8.5a2.5 2.5 0 0 0 2.5-2.5h13A2.5 2.5 0 0 0 21 8.5v7a2.5 2.5 0 0 0-2.5 2.5h-13A2.5 2.5 0 0 0 3 15.5zM14 6v12" /><path d="M14 9.5v1M14 13.5v1"/>',
  otros:'<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>',
  sueldo:'<path d="M3.5 8h17v11.5h-17zM8.5 8V5.5h7V8M3.5 13h17M11 13v2h2v-2"/>',
  laptop:'<path d="M5 5.5h14v9.5H5zM2.5 19h19"/>',
  ventas:'<path d="M5 8h14l-1.2 12.5H6.2zM9 8V6.5a3 3 0 0 1 6 0V8"/>',
  servicios:'<path d="M13.5 2.5 5 13.5h6.5l-1 8L19 10.5h-6.5z"/>',
  subs:'<rect x="3" y="4.5" width="18" height="12.5" rx="2.5"/><path d="M8.5 20.5h7M10.5 8.3v5.4l4.5-2.7z"/>',
  seguro:'<path d="M12 3l7.5 3v5.5c0 5-3.3 8.3-7.5 9.5-4.2-1.2-7.5-4.5-7.5-9.5V6z"/><path d="m9 12 2.2 2.2L15.5 10"/>',
  escuela:'<path d="M2.5 9 12 4.5 21.5 9 12 13.5zM6.5 11v5c1.6 1.7 3.5 2.5 5.5 2.5s3.9-.8 5.5-2.5v-5M21.5 9v5"/>',
  tarjeta:'<rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/>',
  moneda:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5.5" stroke-opacity=".45"/><path d="M13.8 10.2c-.4-.7-1.1-1-1.8-1-1 0-1.8.6-1.8 1.4s.7 1.1 1.8 1.4 1.8.7 1.8 1.5-.8 1.4-1.8 1.4c-.8 0-1.5-.4-1.9-1M12 8v1.2M12 14.9v1.1"/>',
  ciclo:'<path d="M4.5 10.5A7.5 7.5 0 0 1 17.8 7M19.5 13.5A7.5 7.5 0 0 1 6.2 17"/><path d="M18.5 3.5v4h-4M5.5 20.5v-4h4"/>',
  meta:'<path d="M5 21V4M5 4.5h12.5l-2.3 4 2.3 4H5"/>',
  estrella:'<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/>',
  sinred:'<path d="M3 3l18 18M8.6 16.4a4.8 4.8 0 0 1 6.2-.4M5.2 12.9a9.6 9.6 0 0 1 4-2.4M18.8 12.9a9.6 9.6 0 0 0-2.1-1.6M2 9.3a14.4 14.4 0 0 1 4.2-2.7M22 9.3A14.4 14.4 0 0 0 10.6 5.6"/><circle cx="12" cy="19.5" r=".8"/>',
  recibo:'<path d="M6 3h12v18l-2.5-1.6L13 21l-2.5-1.6L8 21l-2-1.6zM9 8h6M9 12h6M9 16h3"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  calendario:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'
};
const ic=(n,c,cls)=>`<svg class="i ${cls||''}" viewBox="0 0 24 24" fill="none" stroke="${c||'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||IC.otros}</svg>`;
const tile=(n,c)=>`<div class="ico" style="background:color-mix(in srgb,${c} 16%,var(--surface))">${ic(n,c)}</div>`;

/* categorías de gastos fijos */
const FCATS=[['Servicios','servicios','#FF9F1C'],['Suscripciones','subs','#9B5DE5'],['Vivienda','casa','#00A3A3'],['Transporte','auto','#3B5BDB'],['Seguros','seguro','#17935A'],['Educación','escuela','#F15BB5'],['Otros','otros','#8C7A86']];
function adivinaFC(n){n=String(n||'').toLowerCase();
  if(/netflix|spotify|disney|hbo|\bmax\b|prime|amazon|apple|icloud|youtube|xbox|playstation|nintendo|gym|gimnasio|suscrip|chatgpt|claude|canva|adobe|google one|paramount|vix|crunchyroll|deezer|streaming|uber one|rappi|membres/.test(n))return 'Suscripciones';
  if(/seguro|gmm|gastos m[eé]dicos/.test(n))return 'Seguros';
  if(/\bluz\b|cfe|agua|\bgas\b|internet|telmex|izzi|totalplay|megacable|celular|tel[eé]fono|telcel|at&t|movistar|cable|wifi|plan de datos/.test(n))return 'Servicios';
  if(/renta|hipoteca|mantenimiento|predial|depa|casa|limpieza/.test(n))return 'Vivienda';
  if(/gasolina|auto|carro|coche|estacionamiento|\btag\b|transporte|metro|pensi[oó]n/.test(n))return 'Transporte';
  if(/escuela|colegiatura|curso|clases|universidad|ingl[eé]s|maestr/.test(n))return 'Educación';
  return 'Otros'}
const fcOf=x=>x&&FCATS.some(c=>c[0]===x.cat)?x.cat:adivinaFC(x&&x.nombre);
function fInfo(x){const f=FCATS.find(c=>c[0]===fcOf(x));return{n:f[0],e:ic(f[1],f[2]),k:f[1],col:f[2]}}

const CATS={
  gasto:[['Comida','comida','#FF9F1C'],['Súper','super','#6DB31E'],['Transporte','auto','#3B5BDB'],['Casa','casa','#00A3A3'],['Salud','salud','#FF5A5F'],['Antojos','antojo','#E4007C'],['Ropa','ropa','#9B5DE5'],['Diversión','ocio','#F15BB5'],['Otros','otros','#8C7A86']],
  ingreso:[['Sueldo','sueldo','#17935A'],['Freelance','laptop','#00A3A3'],['Ventas','ventas','#FF9F1C'],['Otros','otros','#8C7A86']]
};
const SPECIAL={Fijos:['calendario','#00A3A3'],Deudas:['tarjeta','#D92D4A']};
function catInfo(tipo,c){if(SPECIAL[c])return{e:ic(SPECIAL[c][0],SPECIAL[c][1]),col:SPECIAL[c][1]};const f=(CATS[tipo]||CATS.gasto).find(x=>x[0]===c)||['Otros','otros','#8C7A86'];return{e:ic(f[1],f[2]),col:f[2]}}

/* ---------- estado y guardado ---------- */
const S={mode:'loading',view:'inicio',scope:'mes',ym:curYM(),filtro:'todo',demo:false,ready:false,stale:false,
  data:{movs:{},ingresos:{},fijos:{},deudas:{},ahorros:{},perfil:{}}};
const CKEY='milana-conexion',SKEY='milana-sesion';
let CONF=null,SES=null,pendientes=0;
const lkey=()=>'milana-cache-'+(SES?SES.id:'x');
const leer=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
const escribir=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function loadLocal(){try{const r=JSON.parse(localStorage.getItem(lkey())||'null');if(r)S.data=Object.assign({movs:{},ingresos:{},fijos:{},deudas:{},ahorros:{},perfil:{}},r)}catch(e){}}
function saveLocal(){try{localStorage.setItem(lkey(),JSON.stringify(S.data))}catch(e){}}

/* todo pasa directo de la app a tu Apps Script, en fila, una cosa a la vez */
let cola=Promise.resolve();
async function llamar(conf,payload){
  const r=await fetch(conf.url,{method:'POST',body:JSON.stringify(Object.assign({key:conf.key},payload))});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'error');return j;
}
function api(payload){const p=cola.then(()=>llamar(CONF,Object.assign({perfil:SES&&SES.id,pin:SES&&SES.pin},payload)));cola=p.catch(()=>{});return p}
function enviar(payload){
  pendientes++;pintarSync();
  api(payload).then(()=>{S.stale=false}).catch(fail).finally(()=>{pendientes--;pintarSync()});
}
function pintarSync(){const n=document.getElementById('sync');if(n)n.innerHTML=syncTxt()}
async function put(col,id,obj){S.pdf=null;S.data[col][id]=obj;saveLocal();render();enviar({action:'put',col,id,obj})}
async function del(col,id){delete S.data[col][id];saveLocal();render();enviar({action:'del',col,id})}
async function savePerfil(p){S.data.perfil=Object.assign({},S.data.perfil,p);saveLocal();render();enviar({action:'perfil',obj:p})}
function fail(e){S.stale=true;const m=e&&e.message;toast(m==='clave'?'La clave no coincide con la de tu hoja.':m==='pin'?'Tu PIN ya no coincide. Vuelve a entrar a tu perfil.':'No se pudo guardar en tu hoja. Revisa tu internet e inténtalo otra vez.')}

async function init(){
  CONF=leer(CKEY);SES=leer(SKEY);S.data={movs:{},ingresos:{},fijos:{},deudas:{},ahorros:{},perfil:{}};S.demo=false;
  if(!CONF){S.mode='setup';S.ready=true;render();return}
  if(!SES){S.mode='perfiles';S.perfiles=null;S.ready=true;render();cargarPerfiles();return}
  S.mode='sheets';loadLocal();
  if(!realVacio()){S.ready=true;decideDemo();render()}
  try{const j=await api({action:'load'});S.data=Object.assign({movs:{},ingresos:{},fijos:{},deudas:{},ahorros:{},perfil:{}},j.data);saveLocal();S.stale=false}
  catch(e){
    if(e.message==='pin'){escribir(SKEY,null);toast('Vuelve a entrar a tu perfil.');return init()}
    S.stale=true;if(e.message==='clave')toast('La clave no coincide con la de tu hoja.')}
  S.ready=true;decideDemo();render();
  if(!S.stale&&!S.demo)autoDomi();
}
async function cargarPerfiles(){
  try{const j=await llamar(CONF,{action:'perfiles'});S.perfiles=j.perfiles;S.perfErr=false}
  catch(e){S.perfiles=[];S.perfErr=true}
  render();
}
const inicial=n=>esc((String(n||'?').trim()[0]||'?').toUpperCase());
const AV=['var(--lila)','var(--mango)','var(--turq)','var(--rosa)','var(--lima)','var(--cobalto)'];
function vPerfiles(){

  const c=curYM();let n=0;
  ['fijos','deudas','ingresos','ahorros'].forEach(col=>Object.entries(S.data[col]||{}).forEach(([id,x])=>{
    if(!x.domi)return;if(col==='ahorros'&&!(+x.mensual>0))return;
    const key=MAPA[col],marcas=Object.assign({},x[key]),hechos=Object.keys(marcas).sort();
    let ym=hechos.length?addM(hechos[hechos.length-1],1):c;let it=Object.assign({},x),cambio=false,guard=0;
    while(ym<=c&&guard++<24){
      if(col==='deudas'&&restan(it)<=0)break;

        marcas[ym]=mid;it=Object.assign({},it,{[key]:marcas});cambio=true;n++;
      }

/* ---------- ahorro ---------- */
function saldoMeta(id,hasta){const d=D(),x=(d.ahorros||{})[id];if(!x)return 0;
  return (+x.inicial||0)+Object.values(d.movs).filter(m=>m.ref&&m.ref.col==='ahorros'&&m.ref.id===id&&(!hasta||(m.fecha||'')<=hasta)).reduce((t,m)=>t+(m.tipo==='retiro'?-1:1)*(+m.monto||0),0)}
function metaLlena(id){const x=(D().ahorros||{})[id];return !!x&&+x.meta>0&&saldoMeta(id)>=+x.meta}
/* lo que se aparta para ahorro en un mes: plan mensual (lo real si ya se apartó) + apartados extra − lo que sacaste */
function ahorroMes(ym){
  const d=D(),pasado=ym<curYM(),metas=Object.entries(d.ahorros||{});
  const movs=Object.entries(d.movs).filter(([,m])=>(m.fecha||'').startsWith(ym)&&(m.tipo==='ahorro'||m.tipo==='retiro'));
  const ligados=new Set(metas.map(([,x])=>(x.aportados||{})[ym]).filter(Boolean));
  let plan=0,planPagado=0;
  metas.forEach(([id,x])=>{const mens=+x.mensual||0;if(!mens)return;const mid=(x.aportados||{})[ym],mv=mid&&d.movs[mid];
    if(mv){plan+=+mv.monto||0;planPagado+=+mv.monto||0;return}
    if(pasado||metaLlena(id)||(x.fecha&&ym>x.fecha))return;plan+=mens});
  const extra=movs.filter(([id])=>!ligados.has(id)).reduce((t,[,m])=>t+(m.tipo==='retiro'?-1:1)*(+m.monto||0),0);
  return{total:plan+extra,plan,planPagado,extra};
}
/* ---------- cálculos ---------- */
/* lo que entra en un mes: ingresos fijos (lo real si ya cayó) + ingresos únicos de ese mes */
function ingresoMes(ym){
  const d=D(),pasado=ym<curYM();
  const unicos=Object.values(d.movs).filter(m=>m.tipo==='ingreso'&&!m.ref&&(m.fecha||'').startsWith(ym)).reduce((t,m)=>t+(+m.monto||0),0);
  const recs=Object.entries(d.ingresos||{}).map(([id,x])=>{const mid=(x.recibidos||{})[ym],mv=mid&&d.movs[mid];return{id,nombre:x.nombre,monto:+x.monto||0,dia:+x.dia||1,domi:!!x.domi,recibido:!!mv,real:mv?(+mv.monto||0):0}});
  const fijos=recs.reduce((t,r)=>t+(r.recibido?r.real:(pasado?0:r.monto)),0);
  let base=fijos+unicos;
  const esperado=+d.perfil.ingresoEsperado||0; // versión anterior
  if(!recs.length&&esperado)base=Math.max(base,esperado);
  return{base,unicos,recs,fijos,pendiente:recs.filter(r=>!r.recibido)};
}
const pagados=x=>(+x.pagadosAntes||0)+Object.keys(x.historial||{}).length;
const restan=x=>Math.max(0,(+x.totalPagos||0)-pagados(x));
function finDeuda(x){const r=restan(x);if(!r)return null;const c=curYM();return addM(c,(x.historial||{})[c]?r:r-1)}
const activaEn=(x,ym)=>!!(x.historial||{})[ym]||(restan(x)>0&&ym>=curYM());

function calc(ym){
  const d=D();
  const movs=Object.entries(d.movs).map(([id,m])=>Object.assign({id},m)).filter(m=>(m.fecha||'').startsWith(ym));
  const ingresos=sum(movs.filter(m=>m.tipo==='ingreso'));
  const gastosAll=movs.filter(m=>m.tipo==='gasto');
  const variables=gastosAll.filter(m=>!m.ref);
  const varTotal=sum(variables);
  const fijos=Object.entries(d.fijos).map(([id,x])=>Object.assign({id},x));
  const deudas=Object.entries(d.deudas).map(([id,x])=>Object.assign({id},x)).filter(x=>activaEn(x,ym));
  const comp=sum(fijos)+deudas.reduce((t,x)=>t+(+x.cuota||0),0);
  const compPagado=fijos.filter(x=>(x.pagados||{})[ym]).reduce((t,x)=>t+(+x.monto||0),0)+deudas.filter(x=>(x.historial||{})[ym]).reduce((t,x)=>t+(+x.cuota||0),0);
  const im=ingresoMes(ym),base=im.base,esperado=0;
  const am=ahorroMes(ym);
  const libre=base-comp-varTotal-am.total;
  let porDia=0,porSemana=0,diasRest=0,semana=0;
  if(ym===curYM()){
    const td=+hoy().slice(8);diasRest=daysIn(ym)-td+1;
    porDia=Math.max(0,libre)/diasRest;porSemana=Math.min(Math.max(0,libre),porDia*Math.min(7,diasRest));
    const now=new Date();const lunes=new Date(now);lunes.setDate(now.getDate()-((now.getDay()+6)%7));const lIso=iso(lunes);
    semana=sum(variables.filter(m=>m.fecha>=lIso&&m.fecha<=hoy()));
  }
  const porCat={};variables.forEach(m=>porCat[m.categoria]=(porCat[m.categoria]||0)+(+m.monto||0));
  return{movs,ingresos,gastos:sum(gastosAll),varTotal,comp,compPagado,compPend:comp-compPagado,esperado,base,libre,porDia,porSemana,diasRest,semana,porCat,fijos,deudas,im,am};
}

/* proyección de un mes: lo que entra menos fijos y deudas de ese mes */
function proj(ym){
  const d=D(),cur=curYM();
  const fijosT=Object.values(d.fijos).reduce((t,x)=>t+(+x.monto||0),0);
  const deud=Object.entries(d.deudas).map(([id,x])=>Object.assign({id},x)).filter(x=>{
    if((x.historial||{})[ym])return true; if(ym<cur)return false; const f=finDeuda(x); return !!f&&ym<=f});
  const deudasT=deud.reduce((t,x)=>t+(+x.cuota||0),0);
  const ahorroT=Math.max(0,ahorroMes(ym).total);
  const esperado=+d.perfil.ingresoEsperado||0;
  const movs=Object.values(d.movs).filter(m=>(m.fecha||'').startsWith(ym));
  const reg=sum(movs.filter(m=>m.tipo==='ingreso'));
  const ingreso=ingresoMes(ym).base;
  const gastadoLibre=sum(movs.filter(m=>m.tipo==='gasto'&&!m.ref));
  const terminan=deud.filter(x=>finDeuda(x)===ym||(restan(x)===0&&(x.historial||{})[ym]&&Object.keys(x.historial).sort().pop()===ym));
  return{ym,ingreso,esperado,fijosT,deudasT,ahorroT,libre:ingreso-fijosT-deudasT-ahorroT,deud,terminan,gastadoLibre,pasado:ym<cur,cur:ym===cur};
}
/* etapas: tramos de meses con las mismas deudas, desde hoy hasta que ya no debas nada */
function etapas(){
  const d=D(),cur=curYM();const rT=Object.values(d.ingresos||{}).reduce((t,x)=>t+(+x.monto||0),0);const base=rT||(+d.perfil.ingresoEsperado||0)||proj(cur).ingreso;
  const fijosT=Object.values(d.fijos).reduce((t,x)=>t+(+x.monto||0),0);
  let last=cur;Object.values(d.deudas).forEach(x=>{const f=finDeuda(x);if(f&&f>last)last=f});
  const end=addM(last,1),out=[];let m=cur,guard=0;
  while(m<=end&&guard++<120){const p=proj(m);const key=p.deud.map(x=>x.id).sort().join(',');const L=out[out.length-1];
    if(L&&L.key===key)L.to=m;else{const dt=p.deud.reduce((t,x)=>t+(+x.cuota||0),0);out.push({key,from:m,to:m,deud:p.deud,libre:base-fijosT-dt-proj(addM(m,m===cur?1:0)).ahorroT})}
    m=addM(m,1)}
  return out;
}
const mC=ym=>{const t=mesL(ym,true);return t[0].toUpperCase()+t.slice(1)};
const rango=(a,b)=>a===b?mC(a):mC(a)+' – '+mC(b);
const nMeses=(a,b)=>{const[y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return (y2-y1)*12+m2-m1+1};
const semanal=x=>x*12/52;

function vAnio(){
  const d=D(),y=S.ym.slice(0,4);
  const sinBase=!(+d.perfil.ingresoEsperado)&&!Object.keys(d.ingresos||{}).length&&!Object.keys(d.fijos).length&&!Object.keys(d.deudas).length;
  if(sinBase)return `<div class="stack">${scopeSeg()}<section class="hero"><div class="lbl">Tu plan del año</div><div class="big" style="font-size:32px">Primero cuéntame qué te entra</div><p class="sub">Con tu ingreso, tus fijos y tus deudas te armo el plan mes por mes.</p><div class="pills"><button class="btn sec" style="color:var(--ink)" data-act="addIngresoFijo">Agregar mi ingreso mensual</button></div></section></div>`;
  const P=Array.from({length:12},(_,i)=>proj(y+'-'+pad(i+1)));
  const mx=Math.max(1,...P.map(p=>Math.max(p.ingreso,p.fijosT+p.deudasT+p.ahorroT)));
  const h=v=>(Math.max(0,v)/mx*100).toFixed(2)+'%';
  const chart=`<section class="card"><div class="lbl">Tu año ${y}, mes por mes</div>
    <div class="ychart" role="img" aria-label="Fijos, deudas y dinero libre de cada mes de ${y}">${P.map(p=>`<div class="ycol ${p.cur?'cur':''}"><div class="flag">${p.terminan.length?ic('meta'):''}</div><div class="stk"><span style="height:${h(p.fijosT)};background:var(--turq)"></span><span style="height:${h(p.deudasT)};background:var(--deuda)"></span><span style="height:${h(p.ahorroT)};background:var(--lila)"></span><span style="height:${h(p.libre)};background:var(--lima)"></span></div><div class="m">${MESES[+p.ym.slice(5)-1].slice(0,3)}</div></div>`).join('')}</div>
    <div class="legend"><div><i class="dot" style="background:var(--turq)"></i>Fijos</div><div><i class="dot" style="background:var(--deuda)"></i>Deudas</div><div><i class="dot" style="background:var(--lila)"></i>Ahorro</div><div><i class="dot" style="background:var(--lima)"></i>Libre para gastar</div><div style="display:flex;align-items:center;gap:6px">${ic('meta','var(--ok)','sm')}Terminas una deuda</div></div></section>`;
  const pagoDeudas=P.reduce((t,p)=>t+p.deudasT,0),libreAnio=P.reduce((t,p)=>t+Math.max(0,p.libre),0);
  const stats=`<div class="sum-strip"><div class="stat"><div class="k"><i class="dot" style="background:var(--bad)"></i>En deudas este año</div><div class="v">${$m(pagoDeudas)}</div></div><div class="stat"><div class="k"><i class="dot" style="background:var(--lima)"></i>Libre en el año</div><div class="v">${$m(libreAnio)}</div></div></div>`;

  // etapas (desde este mes)
  const E=etapas();let etHtml='';
  if(E.length){
    etHtml=`<h2 class="h2">Tu plan: así se va liberando tu dinero</h2><div class="stack" style="gap:6px">`+E.map((e,i)=>{
      const ultima=i===E.length-1,neg=e.libre<0,sinDeuda=!e.deud.length;
      const rng=ultima&&E.length>1?`Desde ${mC(e.from)} en adelante`:(ultima?`Desde ${mC(e.from)}`:`${rango(e.from,e.to)} · ${nMeses(e.from,e.to)} ${nMeses(e.from,e.to)===1?'mes':'meses'}`);
      let card=`<div class="etapa ${sinDeuda?'libre':''} ${neg?'neg':''}"><div class="rng">${rng}</div>
        <div class="lib">${neg?'−'+$m(-e.libre):$m(e.libre)} <small>${neg?'te faltan al mes':'libres al mes'}</small></div>
        <div class="muted" style="font-size:13.5px">${neg?'Tus pagos son más que lo que entra. Aquí hay que ajustar.':`Eso es ≈ ${$m(semanal(e.libre))} a la semana para tus gastos.`}</div>
        ${sinDeuda?`<div style="font-weight:700;color:var(--ok);display:flex;align-items:center;gap:6px">${ic('estrella')}Ya sin deudas</div>`:`<div class="paying">${e.deud.map(x=>`<span>${ic('tarjeta')}${esc(x.nombre)} · ${$m(x.cuota)}</span>`).join('')}</div>`}</div>`;
      if(!ultima){const nx=E[i+1];const salen=e.deud.filter(x=>!nx.deud.some(z=>z.id===x.id));const gana=salen.reduce((t,x)=>t+(+x.cuota||0),0);
        if(salen.length)card+=`<div class="salto"><div class="ar">↓</div><div>En <b style="color:inherit;text-transform:capitalize">${mesL(e.to,true)}</b> haces el último pago de ${salen.map(x=>esc(x.nombre)).join(' y ')}. Desde ${mesL(nx.from,true)} tienes <b>+${$m(gana)}</b> libres al mes.</div></div>`}
      return card}).join('')+`</div>`;
  }

  // detalle mes por mes
  const rows=P.map(p=>{
    const ev=[...p.terminan.map(x=>`<span class="chip ok">${ic('meta')} Terminas ${esc(x.nombre)}</span>`)];
    const prev=proj(addM(p.ym,-1));const libera=prev.deud.filter(x=>!p.deud.some(z=>z.id===x.id)&&!p.pasado).reduce((t,x)=>t+(+x.cuota||0),0);
    if(libera)ev.push(`<span class="chip soon">+${$m(libera)} liberados</span>`);
    let v;
    const conDatos=Object.values(D().movs).some(m=>(m.fecha||'').startsWith(p.ym));
    if(p.pasado&&!conDatos)v=`<span class="muted">—</span><small>sin registros</small>`;
    else if(p.pasado||p.cur){const real=p.libre-p.gastadoLibre;v=`${real<0?'−':''}${$m(Math.abs(real))}<small>${p.cur?'te queda':(real<0?'te faltó':'te sobró')}</small>`}
    else v=`${p.libre<0?'−':''}${$m(Math.abs(p.libre))}<small>≈ ${$m(semanal(Math.max(0,p.libre)))}/sem</small>`;
    return `<div class="mrow ${p.cur?'cur':''}"><div class="mn">${MESES[+p.ym.slice(5)-1].slice(0,3)}</div><div class="ev">${ev.join('')||`<span class="muted" style="font-size:12.5px">${p.deud.length?p.deud.length+(p.deud.length===1?' deuda':' deudas')+' · '+$m(p.deudasT):'Sin deudas'}</span>`}</div><div class="v">${v}</div></div>`}).join('');
  const detalle=`<h2 class="h2">Mes por mes</h2><section class="card" style="padding-block:4px">${rows}</section><p class="hint" style="margin:2px">Los meses que ya pasaron muestran lo que de verdad te sobró. Los que vienen muestran lo que tendrás libre para gastar.</p>`;
  return `<div class="stack">${scopeSeg()}${etHtml}${chart}${stats}${detalle}</div>`;
}

/* ---------- reporte del mes ---------- */
function datosReporte(ym){
  const d=D(),c=calc(ym),cur=curYM();
  const mv=id=>id&&d.movs[id];
  const ingresos=[...c.im.recs.map(r=>({n:r.nombre,sub:`Ingreso fijo · día ${r.dia}`,m:r.recibido?r.real:(ym<cur?0:r.monto),st:r.recibido?'ok':(ym<cur?'no':(r.domi?'au':'pend'))})).filter(x=>x.st!=='no'),
    ...c.movs.filter(m=>m.tipo==='ingreso'&&!m.ref).sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(m=>({n:m.nota||m.categoria,sub:`${m.categoria} · ${fechaC(m.fecha)}`,m:+m.monto,st:'ok'}))];
  const fijos=FCATS.map(([n,k,col])=>{const xs=c.fijos.filter(x=>fcOf(x)===n).sort((a,b)=>(a.dia||0)-(b.dia||0)).map(x=>{const p=mv((x.pagados||{})[ym]);return{n:x.nombre,sub:`Día ${x.dia}`,m:p?+p.monto:+x.monto,st:p?'ok':(x.domi?'au':'pend')}});return{n,k,col,xs,t:xs.reduce((t,x)=>t+x.m,0)}}).filter(g=>g.xs.length);
  const deudas=c.deudas.map(x=>{const p=mv((x.historial||{})[ym]);const num=Math.min(pagados(x)+(p?0:1),x.totalPagos);return{n:x.nombre,sub:`Pago ${num} de ${x.totalPagos} · día ${x.dia}`,m:p?+p.monto:+x.cuota,st:p?'ok':(x.domi?'au':'pend')}});
  const vars={};c.movs.filter(m=>m.tipo==='gasto'&&!m.ref).forEach(m=>(vars[m.categoria]=vars[m.categoria]||[]).push(m));
  const variables=Object.entries(vars).map(([n,xs])=>({n,info:catInfo('gasto',n),xs:xs.sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(m=>({n:m.nota||n,sub:fechaC(m.fecha),m:+m.monto})),t:xs.reduce((t,m)=>t+(+m.monto||0),0)})).sort((a,b)=>b.t-a.t);
  const ahorro=Object.entries(d.ahorros||{}).map(([id,x])=>{const ms=c.movs.filter(m=>(m.tipo==='ahorro'||m.tipo==='retiro')&&m.ref&&m.ref.id===id);const hecho=ms.reduce((t,m)=>t+(m.tipo==='retiro'?-1:1)*(+m.monto||0),0);
    const plan=+x.mensual>0&&!(x.aportados||{})[ym]&&ym>=cur&&!metaLlena(id)&&!(x.fecha&&ym>x.fecha)?+x.mensual:0;
    return{n:x.nombre,sub:plan?`Por apartar · día ${x.dia}`:(hecho<0?'Sacaste del ahorro':'Apartado este mes'),m:hecho+plan,hecho,plan,st:plan?(x.domi?'au':'pend'):'ok'}}).filter(x=>x.m||x.hecho);
  const sumG=gs=>gs.reduce((t,g)=>t+g.t,0),sumX=xs=>xs.reduce((t,x)=>t+x.m,0);
  const tIng=c.base,tFij=sumG(fijos),tDeu=sumX(deudas),tVar=c.varTotal,tAho=Math.max(0,c.am.total);
  const pend=[...fijos.flatMap(g=>g.xs),...deudas,...ahorro.map(a=>({...a,m:a.plan}))].filter(x=>x.st==='pend'||x.st==='au').filter(x=>x.m>0);
  const porRecibir=ingresos.filter(x=>x.st!=='ok').reduce((t,x)=>t+x.m,0);
  return{ym,c,ingresos,fijos,deudas,variables,ahorro,tIng,tFij,tDeu,tVar,tAho,balance:c.libre,pend,tPend:sumX(pend),porRecibir};
}
const fechaC=f=>{const dt=new Date(f+'T12:00:00');return dt.getDate()+' '+MESES[dt.getMonth()].slice(0,3)};
const STX={ok:'Pagado',pend:'Pendiente',au:'Automático'};
function vReporte(){
  const r=datosReporte(S.ym),mes=mesL(S.ym),Mes=mes[0].toUpperCase()+mes.slice(1);
  const fila=x=>`<div class="rl"><div class="n">${esc(x.n)}${x.sub?`<small>${esc(x.sub)}</small>`:''}</div><div class="m">${$m2(x.m)}</div></div>`;
  const tot=(n,v)=>`<div class="rl tot"><div class="n">${n}</div><div class="m">${$m2(v)}</div></div>`;
  const grupo=(icono,n,t)=>`<div class="rl sub"><div class="n" style="display:flex;align-items:center;gap:6px">${icono}${esc(n)}</div><div class="m">${$m2(t)}</div></div>`;

  const tFijos=r.tFij+r.tDeu;
  const ingresos=sec('sueldo','#17935A','Detalle de ingresos',r.ingresos.length?r.ingresos.map(fila).join('')+tot('Total de ingresos',r.tIng):vacio('Sin ingresos registrados.'));
  const fijos=sec('calendario','#00A3A3','Detalle de gastos fijos',gruposFijos.length?gruposFijos.map(g=>grupo(g.icono,g.n,g.t)+g.xs.map(fila).join('')).join('')+tot('Total de gastos fijos',tFijos):vacio('Sin gastos fijos.'));
  const vars=sec('recibo','#E4007C','Gastos variables',r.variables.length?r.variables.map(g=>grupo(g.info.e,g.n,g.t)+g.xs.map(fila).join('')).join('')+tot('Total de gastos variables',r.tVar):vacio('Sin gastos variables este mes.'));
  const ahorro=r.ahorro.length?sec('moneda','#9B5DE5','Ahorro',r.ahorro.map(x=>fila({n:x.n,sub:'Apartado',m:x.m})).join('')+tot('Total de ahorro',r.tAho)):'';
  const neg=r.balance<0;
  const resumen=`<section class="res"><div class="lbl">Resultado del mes</div>
    <div class="rl"><div class="n">Ingresos</div><div class="m" style="color:var(--ok)">+${$m2(r.tIng)}</div></div>
    <div class="rl"><div class="n">Gastos fijos</div><div class="m">−${$m2(tFijos)}</div></div>
    <div class="rl"><div class="n">Gastos variables</div><div class="m">−${$m2(r.tVar)}</div></div>
    ${r.tAho?`<div class="rl"><div class="n">Ahorro</div><div class="m">−${$m2(r.tAho)}</div></div>`:''}
    <div class="rl tot"><div class="n">${neg?'Te faltó':'Te quedó'}</div><div class="m" style="color:${neg?'var(--bad)':'var(--ok)'};font-size:20px">${neg?'−':''}${$m2(Math.abs(r.balance))}</div></div></section>`;
  const gen=new Date();
  const btnPdf=S.pdf&&S.pdf.ym===S.ym?`<button class="btn pri" data-act="pdfListo">${ic('check')} Guardar o mandar PDF</button>`:`<button class="btn pri" data-act="pdf" ${S.pdfCargando?'disabled':''}>${S.pdfCargando?'Preparando PDF…':'Crear PDF'}</button>`;
  return `<div class="stack">
    <div class="rep-acts no-print"><button class="btn sec" data-act="volver">‹ Regresar</button><span style="flex:1"></span>${btnPdf}</div>
    <div id="rep" class="stack">
    <div class="rep-h"><img src="logo.svg" alt=""><div><div class="t">Reporte de ${esc(Mes)}</div><div class="s">${SES?esc(SES.nombre)+' · ':''}Hecho el ${gen.getDate()} de ${MESES[gen.getMonth()]} de ${gen.getFullYear()}</div></div></div>
    ${resumen}${ingresos}${fijos}${vars}${ahorro}</div></div>`;
}

/* ---------- PDF profesional: se dibuja como documento tamaño carta (texto real, no captura de pantalla) ---------- */
function cargarScript(src){return new Promise((ok,mal)=>{if(window.__libs&&window.__libs[src])return ok();const sc=document.createElement('script');sc.src=src;sc.onload=()=>{(window.__libs=window.__libs||{})[src]=1;ok()};sc.onerror=mal;document.head.appendChild(sc)})}
const LIB_PDF='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const LIB_H2C=LIB_PDF; // compatibilidad con la precarga
const FUENTES={
  MontserratB:['Montserrat','montserrat','700Bold'],MontserratX:['Montserrat','montserrat','800ExtraBold'],
  NunitoR:['Nunito','nunito','400Regular'],NunitoB:['Nunito','nunito','700Bold']};
let FUENTES_PDF=null;
const b64=buf=>{let s='',u=new Uint8Array(buf);for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
async function bajarFuentes(){
  if(FUENTES_PDF)return FUENTES_PDF;
  const out={};
  await Promise.all(Object.entries(FUENTES).map(async([k,[fam,pkg,peso]])=>{
    const file=`${fam}_${peso}.ttf`,urls=[`https://cdn.jsdelivr.net/npm/@expo-google-fonts/${pkg}/${peso}/${file}`,`https://cdn.jsdelivr.net/npm/@expo-google-fonts/${pkg}/${file}`,`https://unpkg.com/@expo-google-fonts/${pkg}/${peso}/${file}`];
    for(const u of urls){try{const r=await fetch(u);if(r.ok){out[k]=b64(await r.arrayBuffer());return}}catch(e){}}
  }));
  FUENTES_PDF=out;return out;
}
async function imagenDataUrl(src){try{const r=await fetch(src);const bl=await r.blob();return await new Promise(ok=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.readAsDataURL(bl)})}catch(e){return null}}
async function crearPdf(){
  if(S.pdfCargando)return;S.pdfCargando=true;render();
  try{
    const [,f,logo]=await Promise.all([cargarScript(LIB_PDF),bajarFuentes(),imagenDataUrl('apple-touch-icon.png')]);
    const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'letter',compress:true});
    // tipografías de la app; si no bajan, se usa Helvetica
    const okF=f.MontserratB&&f.NunitoR&&f.NunitoB;
    if(okF){[['MontserratB','Montserrat','bold'],['MontserratX','MontserratX','bold'],['NunitoR','Nunito','normal'],['NunitoB','Nunito','bold']].forEach(([k,fam,st])=>{if(!f[k])return;doc.addFileToVFS(k+'.ttf',f[k]);doc.addFont(k+'.ttf',fam,st)})}
    const T=(tipo)=>{if(!okF){doc.setFont('helvetica',tipo==='r'?'normal':'bold');return}
      if(tipo==='h')doc.setFont(f.MontserratX?'MontserratX':'Montserrat','bold');else if(tipo==='t')doc.setFont('Montserrat','bold');else doc.setFont('Nunito',tipo==='b'?'bold':'normal')};
    const txt=v=>okF?String(v):String(v).replace(/[−–]/g,'-').replace(/[^\x00-\xFF]/g,'');
    const dinero=n=>txt($m2(n));
    const C={ink:[43,26,47],muted:[128,108,121],line:[234,223,230],rosa:[228,0,124],ok:[23,147,90],bad:[217,45,74],turq:[0,163,163],lila:[155,93,229],lima:[109,179,30],banda:[250,245,248]};
    const col=(c,fn='setTextColor')=>doc[fn](...C[c]);
    const W=215.9,H=279.4,M=18,AN=W-2*M,PIE=H-14;
    const r=datosReporte(S.ym),mes=mesL(S.ym),Mes=mes[0].toUpperCase()+mes.slice(1);
    const gruposFijos=[...r.fijos.map(g=>({n:g.n,col:g.col,t:g.t,xs:g.xs})),...(r.deudas.length?[{n:'Deudas',col:'#D92D4A',t:r.tDeu,xs:r.deudas}]:[])];
    const tFijos=r.tFij+r.tDeu,neg=r.balance<0;
    const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
    const corta=(s,w)=>{s=txt(s);if(doc.getTextWidth(s)<=w)return s;while(s.length>1&&doc.getTextWidth(s+'…')>w)s=s.slice(0,-1);return s+(okF?'…':'...')};
    let y=M;
    // ----- encabezado -----
    const hoyD=new Date();
    if(logo)doc.addImage(logo,'PNG',M,y,15,15);
    T('r');doc.setFontSize(9);col('muted');doc.text(txt('REPORTE MENSUAL'),M+20,y+5);
    T('h');doc.setFontSize(20);col('ink');doc.text(txt(Mes),M+20,y+13);
    T('r');doc.setFontSize(9);col('muted');
    doc.text(txt(SES?SES.nombre:''),W-M,y+5,{align:'right'});
    doc.text(txt(`Generado el ${hoyD.getDate()} de ${MESES[hoyD.getMonth()]} de ${hoyD.getFullYear()}`),W-M,y+10,{align:'right'});
    T('t');doc.setFontSize(9);col('rosa');doc.text('Mi Lana',W-M,y+15,{align:'right'});
    y+=21;col('rosa','setDrawColor');doc.setLineWidth(.8);doc.line(M,y,W-M,y);y+=8;
    // ----- resultado (protagonista) -----
    const altoRes=56;
    col('banda','setFillColor');doc.roundedRect(M,y,AN,altoRes,4,4,'F');
    const xi=M+8;
    T('t');doc.setFontSize(9);col('muted');doc.text(txt('RESULTADO DEL MES'),xi,y+10);
    T('r');doc.setFontSize(11);col('ink');doc.text(txt(neg?'Te faltó':'Te quedó'),xi,y+18);
    T('h');doc.setFontSize(34);col(neg?'bad':'ok');doc.text((neg?'-':'')+dinero(Math.abs(r.balance)),xi,y+33);
    // proporción del ingreso
    const base=Math.max(r.tIng,tFijos+r.tVar+r.tAho,1),bw=AN/2-14,bx=xi,by=y+42;
    let bxx=bx;const seg=(v,c)=>{const w=Math.max(0,v)/base*bw;if(w<=0)return;col(c,'setFillColor');doc.rect(bxx,by,w,4,'F');bxx+=w};
    col('line','setFillColor');doc.roundedRect(bx,by,bw,4,2,2,'F');seg(tFijos,'turq');seg(r.tVar,'rosa');seg(r.tAho,'lila');seg(r.balance,'lima');
    T('r');doc.setFontSize(8);col('muted');doc.text(txt(r.tIng?`Usaste el ${Math.round(Math.min(999,(tFijos+r.tVar+r.tAho)/r.tIng*100))}% de lo que entró`:'Sin ingresos registrados'),bx,by+9);
    // desglose a la derecha
    const xr=M+AN/2+6,xv=W-M-8;let yy=y+12;
    const lineaRes=(n,v,c,signo)=>{T('r');doc.setFontSize(10.5);col('ink');doc.text(txt(n),xr,yy);T('t');doc.setFontSize(11);col(c);doc.text(signo+dinero(v),xv,yy,{align:'right'});yy+=8.5};
    lineaRes('Ingresos',r.tIng,'ok','+');lineaRes('Gastos fijos',tFijos,'ink','-');lineaRes('Gastos variables',r.tVar,'ink','-');if(r.tAho)lineaRes('Ahorro',r.tAho,'ink','-');
    col('ink','setDrawColor');doc.setLineWidth(.4);doc.line(xr,yy-4.5,xv,yy-4.5);
    T('t');doc.setFontSize(11);col('ink');doc.text(txt(neg?'Te faltó':'Te quedó'),xr,yy+1);col(neg?'bad':'ok');doc.text((neg?'-':'')+dinero(Math.abs(r.balance)),xv,yy+1,{align:'right'});
    y+=altoRes+10;
    // ----- secciones de detalle (más pequeñas) -----
    const nuevaHoja=()=>{doc.addPage();y=M;T('t');doc.setFontSize(9);col('muted');doc.text(txt(`Mi Lana · ${Mes}`),M,y);y+=8};
    const espacio=h=>{if(y+h>PIE-6)nuevaHoja()};

    const fila=(n,d,v)=>{espacio(6);T('r');doc.setFontSize(9.5);col('ink');doc.text(corta(n,AN*.55),M+2,y);col('muted');doc.setFontSize(8.5);if(d)doc.text(corta(d,AN*.25),M+AN*.6,y);col('ink');doc.setFontSize(9.5);doc.text(dinero(v),W-M-2,y,{align:'right'});y+=2;col('line','setDrawColor');doc.setLineWidth(.15);doc.line(M+2,y,W-M-2,y);y+=4};
    const sub=(n,v,c)=>{espacio(14);col('banda','setFillColor');doc.rect(M,y-4,AN,6.2,'F');doc.setFillColor(...hex(c));doc.circle(M+3.2,y-.9,1.2,'F');T('b');doc.setFontSize(9.5);col('ink');doc.text(txt(n),M+6.5,y);doc.text(dinero(v),W-M-2,y,{align:'right'});y+=6.5};
    const total=(n,v)=>{espacio(10);y+=1;col('ink','setDrawColor');doc.setLineWidth(.4);doc.line(M,y-3.5,W-M,y-3.5);T('t');doc.setFontSize(10.5);col('ink');doc.text(txt(n),M+2,y+1);doc.text(dinero(v),W-M-2,y+1,{align:'right'});y+=11};

    if(r.ingresos.length){r.ingresos.forEach(x=>fila(x.n,x.sub,x.m));total('Total de ingresos',r.tIng)}else vacio('Sin ingresos registrados.');
    titulo('Detalle de gastos fijos','#00A3A3');
    if(gruposFijos.length){gruposFijos.forEach(g=>{sub(g.n,g.t,g.col);g.xs.forEach(x=>fila(x.n,x.sub,x.m))});total('Total de gastos fijos',tFijos)}else vacio('Sin gastos fijos.');
    titulo('Gastos variables','#E4007C');
    if(r.variables.length){r.variables.forEach(g=>{sub(g.n,g.t,g.info.col);g.xs.forEach(x=>fila(x.n,x.sub,x.m))});total('Total de gastos variables',r.tVar)}else vacio('Sin gastos variables este mes.');
    if(r.ahorro.length){titulo('Ahorro','#9B5DE5');r.ahorro.forEach(x=>fila(x.n,'Apartado',x.m));total('Total de ahorro',r.tAho)}
    // ----- pie en cada hoja -----

      doc.text(txt(`Mi Lana · Reporte de ${mes}`),M,PIE);doc.text(txt(`Página ${i} de ${n}`),W-M,PIE,{align:'right'})}
    const nombre=`Mi Lana - ${mesL(S.ym)}${SES?' - '+SES.nombre:''}.pdf`;
    S.pdf={ym:S.ym,nombre,blob:doc.output('blob')};
    toast('Listo, tu PDF ya está.');
  }catch(e){console.error(e);toast('No pude crear el PDF. Revisa tu internet e inténtalo otra vez.')}
  finally{S.pdfCargando=false;render()}
}
async function entregarPdf(){
  const p=S.pdf;if(!p)return;
  const archivo=new File([p.blob],p.nombre,{type:'application/pdf'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[archivo]})){await navigator.share({files:[archivo],title:p.nombre});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const url=URL.createObjectURL(p.blob),a=document.createElement('a');a.href=url;a.download=p.nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}

    let plan='';

    else if(meta&&x.fecha){const n=Math.max(1,nMeses((x.aportados||{})[cur]?addM(cur,1):cur,x.fecha));plan=x.fecha<cur?`Tu fecha (${mC(x.fecha)}) ya pasó. Te faltan ${$m(meta-sal)}.`:`Para llegar en <b>${mC(x.fecha)}</b> aparta <b>${$m((meta-sal)/n)}</b> al mes.`}
    else if(meta&&mens){const n=Math.ceil((meta-sal)/mens);plan=`A ${$m(mens)} al mes llegas en <b>${mC(addM(cur,(x.aportados||{})[cur]?n:n-1))}</b>.`}
    else if(meta)plan=`Te faltan <b>${$m(meta-sal)}</b>.`;
    const chip=!mens||(meta&&sal>=meta)?'':hecho?chipMarcado(hecho,'Apartado'):x.domi?`<span class="chip auto">${ic('ciclo')} Automático</span>`:`<button class="chip btnchip" data-act="toggleAhorro" data-id="${x.id}">Apartar ${$m(mens)}</button>`;
    return `<section class="card meta"><div class="debt-head"><button style="text-align:left;min-width:0;display:flex;gap:12px;align-items:center" data-act="editMeta" data-id="${x.id}">${tile('moneda','#9B5DE5')}<div style="min-width:0"><div class="t">${esc(x.nombre)}</div><div class="s muted" style="font-size:13px">${mens?`${$m(mens)} al mes · día ${x.dia}${x.domi?' · automático':''}`:'Sin aportación fija'}</div></div></button>${chip}</div>

      ${meta?`<div class="bar" style="height:12px"><span style="width:${pct.toFixed(1)}%;background:var(--lila)"></span></div>`:''}
      ${plan?`<div style="font-size:14px">${plan}</div>`:''}
      <div class="meta-acts"><button class="btn sec" data-act="aportar" data-id="${x.id}">+ Apartar</button><button class="btn sec" data-act="sacar" data-id="${x.id}">Sacar</button></div></section>`};
  return `<div class="stack" style="gap:10px">${head}
    <section class="card saved"><div class="lbl">Tienes ahorrado</div><div class="big" style="margin:8px 0 6px">${$m(total)}</div><div class="muted" style="font-size:14px">${esteMes>=0?'Este mes apartaste':'Este mes sacaste'} <b style="color:var(--ink)">${$m(Math.abs(esteMes))}</b>${am.plan>am.planPagado?` · te falta apartar ${$m(am.plan-am.planPagado)}`:''}</div></section>
    ${metas.map(card).join('')}
    <p class="hint" style="margin:4px 2px">Lo que apartas se descuenta de lo que puedes gastar, para que no te lo gastes sin querer.</p></div>`;
}

function vDeudas(){
  const d=D();const all=Object.entries(d.deudas).map(([id,x])=>Object.assign({id},x));
  const activas=all.filter(x=>restan(x)>0).sort((a,b)=>(finDeuda(a)||'').localeCompare(finDeuda(b)||''));
  const liquidadas=all.filter(x=>restan(x)===0);
  const saldo=activas.reduce((t,x)=>t+restan(x)*(+x.cuota||0),0);
  const mensual=activas.reduce((t,x)=>t+(+x.cuota||0),0);
  const card=x=>{const r=restan(x),p=pagados(x),T=+x.totalPagos||1,cur=curYM(),paidNow=!!(x.historial||{})[S.ym],fin=finDeuda(x);
    const segs=T<=24?Array.from({length:T},(_,i)=>`<span class="${i<p?(paidNow&&i===p-1&&S.ym===cur?'now':'done'):''}"></span>`).join(''):`<span class="done" style="width:${(p/T*100).toFixed(1)}%"></span>`;
    return `<section class="card debt"><div class="debt-head"><button style="text-align:left;min-width:0" data-act="editDeuda" data-id="${x.id}"><div class="t">${esc(x.nombre)}</div><div class="s muted" style="font-size:13px">${$m2(x.cuota)} al mes · día ${x.dia}${x.domi?' · domiciliado':''}</div></button>
      ${r===0&&!paidNow?`<span class="chip ok">${ic('estrella')} Liquidada</span>`:paidNow?chipMarcado((x.historial||{})[S.ym],r===0?'Liquidada · Pagado':'Pagado'):x.domi?`<span class="chip auto">${ic('ciclo')} Domiciliado</span>`:`<button class="chip btnchip" data-act="payDeuda" data-id="${x.id}">Registrar pago</button>`}</div>
      <div class="prog ${T>24?'long':''}" role="img" aria-label="${p} de ${T} pagos">${segs}</div>
      <div class="debt-meta"><div><span class="muted">Pagos</span><b>${p} de ${T}</b></div><div><span class="muted">Te falta</span><b>${$m(r*(+x.cuota||0))}</b></div><div><span class="muted">Terminas en</span><b style="text-transform:capitalize">${fin?mesL(fin,true):'—'}</b></div></div></section>`};
  const timeline=activas.length?`<h2 class="h2">Cuándo se te libera lana</h2><section class="card free" style="padding-block:4px">${(()=>{let acum=0;return activas.map(x=>{acum+=+x.cuota||0;return `<div class="row"><div class="when">${esc(MESES[+finDeuda(x).slice(5)-1].slice(0,3))}<br><span class="muted" style="font-size:12px;font-weight:500">${finDeuda(x).slice(0,4)}</span></div><div style="min-width:0"><div style="font-weight:600">${esc(x.nombre)}</div><div class="muted" style="font-size:12.5px">Después tendrás ${$m(acum)}/mes más</div></div><div class="gain">+${$m(x.cuota)}</div></div>`}).join('')})()}</section>`:'';
  const head=`<div style="display:flex;justify-content:space-between;align-items:center"><h2 class="h2" style="margin:0">Deudas</h2>${all.length?'<button class="btn ghost" data-act="addDeuda">+ Agregar</button>':''}</div>`;
  if(!all.length)return `<div class="stack" style="gap:10px">${head}<div class="card empty"><span class="em">${ic('tarjeta')}</span><p>Da de alta tus préstamos, tarjetas a meses o lo que estés pagando. Te digo cuánto te falta y cuándo terminas.</p><button class="btn pri" data-act="addDeuda">Agregar deuda</button></div></div>`;
  return `<div class="stack" style="gap:10px">${head}
    <div class="sum-strip"><div class="stat"><div class="k"><i class="dot" style="background:var(--bad)"></i>Te falta pagar</div><div class="v">${$m(saldo)}</div></div><div class="stat"><div class="k"><i class="dot" style="background:var(--warn)"></i>Pagas al mes</div><div class="v">${$m(mensual)}</div></div></div>
    ${activas.map(card).join('')}${timeline}
    ${liquidadas.length?`<h2 class="h2">Ya liquidadas</h2>${liquidadas.map(card).join('')}`:''}</div>`;
}

    <label class="fld"><span>Nombre</span><input id="fNom" placeholder="Luz, internet, Netflix, renta…" value="${esc(x?x.nombre:'')}"></label>
    <div class="fld"><span>Categoría</span><div class="cats" id="fCats"></div></div>
    <div class="row2"><label class="fld"><span>Monto al mes</span><input id="fMon" inputmode="decimal" placeholder="$0" value="${x?x.monto:''}"></label><label class="fld"><span>Día de pago</span><input id="fDia" type="number" inputmode="numeric" min="1" max="31" placeholder="1–31" value="${x?x.dia:''}"></label></div>
    ${swDomi('fDom',x&&x.domi,'Está domiciliado','Se cobra solo. Lo marco como pagado el día de pago.')}
    <div class="err" id="fErr" hidden></div>
    <div class="actions">${x?delBtn('Borrar'):''}<button class="btn pri">Guardar</button></div></form>`,root=>{
    let cat=x?fcOf(x):null,elegida=!!(x&&x.cat);
    const pintaC=()=>{const c=cat||adivinaFC(root.querySelector('#fNom').value);const box=root.querySelector('#fCats');
      box.innerHTML=FCATS.map(([n,k,col])=>`<button type="button" class="${n===c?'on':''}" style="--c:${col}" data-c="${n}">${ic(k,col)} ${n}</button>`).join('');
      box.querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;elegida=true;pintaC()})};
    root.querySelector('#fNom').addEventListener('input',()=>{if(!elegida){cat=null;pintaC()}});pintaC();
    armDelete(root,()=>{del('fijos',id);toast('Gasto fijo borrado')});
    if(!x)setTimeout(()=>root.querySelector('#fNom').focus(),250);
    root.querySelector('#ff').onsubmit=e=>{e.preventDefault();const nombre=root.querySelector('#fNom').value.trim(),monto=num(root.querySelector('#fMon').value),dia=Math.min(31,Math.max(1,parseInt(root.querySelector('#fDia').value)||0));
      const er=root.querySelector('#fErr');if(!nombre||!monto||!parseInt(root.querySelector('#fDia').value)){er.hidden=false;er.textContent='Llena nombre, monto y día de pago.';return}
      put('fijos',id||uid(),Object.assign({pagados:{}},x||{},{nombre,monto,dia,cat:cat||adivinaFC(nombre),domi:root.querySelector('#fDom').checked}));closeSheet();autoDomi();toast(x?'Gasto fijo actualizado':'Gasto fijo agregado')};
  });
}
function toggleFijo(id){const x=S.data.fijos[id];if(!x)return;const p=Object.assign({},x.pagados);
  if(p[S.ym]){const mid=p[S.ym];delete p[S.ym];put('fijos',id,Object.assign({},x,{pagados:p}));if(S.data.movs[mid])del('movs',mid);toast('Marcado como pendiente');return}
  const mid=uid();put('movs',mid,{tipo:'gasto',monto:+x.monto,categoria:'Fijos',nota:x.nombre,fecha:S.ym===curYM()?hoy():fechaEn(S.ym,x.dia),ref:{col:'fijos',id}});
  p[S.ym]=mid;put('fijos',id,Object.assign({},x,{pagados:p}));toast(`${x.nombre} pagado`)}

function sheetDeuda(id){
  const x=id?S.data.deudas[id]:null;const yaHist=x?Object.keys(x.historial||{}).length:0;
  openSheet(`<h3>${x?'Editar deuda':'Nueva deuda'}</h3><form class="f" id="fd">
    <label class="fld"><span>¿Qué estás pagando?</span><input id="dNom" placeholder="Préstamo, tarjeta, Coppel…" value="${esc(x?x.nombre:'')}"></label>
    <div class="row2"><label class="fld"><span>Pago mensual</span><input id="dCuo" inputmode="decimal" placeholder="$0" value="${x?x.cuota:''}"></label><label class="fld"><span>Día de pago</span><input id="dDia" type="number" inputmode="numeric" min="1" max="31" placeholder="1–31" value="${x?x.dia:''}"></label></div>
    <div class="row2"><label class="fld"><span>Pagos en total</span><input id="dTot" type="number" inputmode="numeric" min="1" placeholder="Ej. 12" value="${x?x.totalPagos:''}"></label><label class="fld"><span>Ya llevas pagados</span><input id="dAnt" type="number" inputmode="numeric" min="0" placeholder="0" value="${x?(+x.pagadosAntes||0)+yaHist:''}"></label></div>
    <p class="hint">“Ya llevas pagados” cuenta todos los pagos que ya hiciste, incluido el de este mes si ya pasó.</p>
    ${swDomi('dDom',x&&x.domi,'Está domiciliado','Se cobra solo. Lo marco como pagado el día de pago.')}
    <div class="err" id="dErr" hidden></div>
    <div class="actions">${x?delBtn('Borrar'):''}<button class="btn pri">Guardar</button></div></form>`,root=>{
    armDelete(root,()=>{del('deudas',id);toast('Deuda borrada')});
    if(!x)setTimeout(()=>root.querySelector('#dNom').focus(),250);
    root.querySelector('#fd').onsubmit=e=>{e.preventDefault();
      const nombre=root.querySelector('#dNom').value.trim(),cuota=num(root.querySelector('#dCuo').value),diaRaw=parseInt(root.querySelector('#dDia').value),tot=parseInt(root.querySelector('#dTot').value),ant=parseInt(root.querySelector('#dAnt').value)||0;
      const er=root.querySelector('#dErr');
      if(!nombre||!cuota||!diaRaw||!tot){er.hidden=false;er.textContent='Llena nombre, pago mensual, día y número de pagos.';return}
      if(ant>tot){er.hidden=false;er.textContent='Los pagos hechos no pueden ser más que el total.';return}
      const domi=root.querySelector('#dDom').checked,dia=Math.min(31,Math.max(1,diaRaw)),nid=id||uid();
      let hist=Object.assign({},(x&&x.historial)||{}),antes=Math.max(0,ant-yaHist);
      // si es domiciliada y el pago de este mes ya pasó, ese pago ya viene contado en "ya llevas pagados"
      if(domi&&!hist[curYM()]&&vencido(curYM(),dia)&&antes>0&&ant<=tot){const mid='a-'+nid+'-'+curYM();hist[curYM()]=mid;antes--;
        put('movs',mid,{tipo:'gasto',monto:cuota,categoria:'Deudas',nota:nombre,fecha:fechaEn(curYM(),dia),ref:{col:'deudas',id:nid}})}
      put('deudas',nid,Object.assign({},x||{},{historial:hist,nombre,cuota,dia,totalPagos:tot,pagadosAntes:antes,domi}));closeSheet();autoDomi();toast(x?'Deuda actualizada':'Deuda agregada')};
  });
}
function payDeuda(id){const x=S.data.deudas[id];if(!x)return;const h=Object.assign({},x.historial);
  if(h[S.ym]){const mid=h[S.ym];delete h[S.ym];put('deudas',id,Object.assign({},x,{historial:h}));if(S.data.movs[mid])del('movs',mid);toast('Pago quitado');return}
  if(restan(x)<=0){toast('Esta deuda ya está liquidada');return}
  const mid=uid();put('movs',mid,{tipo:'gasto',monto:+x.cuota,categoria:'Deudas',nota:x.nombre,fecha:S.ym===curYM()?hoy():fechaEn(S.ym,x.dia),ref:{col:'deudas',id}});
  h[S.ym]=mid;const nx=Object.assign({},x,{historial:h});put('deudas',id,nx);
  toast(restan(nx)===0?`¡Liquidaste ${x.nombre}!`:`Pago registrado · te faltan ${restan(nx)}`)}


/* ---------- acciones ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==='tab'){S.view=b.dataset.v;render();window.scrollTo({top:0});return}
  if(a==='prevM'||a==='nextM')S.pdf=null;
  if(a==='prevM'){S.ym=addM(S.ym,esAnual()?-12:-1);render();return}
  if(a==='nextM'){S.ym=addM(S.ym,esAnual()?12:1);render();return}
  if(a==='scope'){S.scope=b.dataset.v;render();return}
  if(a==='reporte'){S.view='reporte';S.pdf=null;render();cargarScript(LIB_PDF).catch(()=>{});bajarFuentes().catch(()=>{});window.scrollTo({top:0});return}
  if(a==='volver'){S.view='inicio';render();window.scrollTo({top:0});return}
  if(a==='pdf'){crearPdf();return}
  if(a==='pdfListo'){entregarPdf();return}
  if(a==='filtro'){S.filtro=b.dataset.v;render();return}
  if(a==='startReal'){await salirDemo();S.view='inicio';render();toast('Empieza con lo que te entra cada mes');sheetIngresoFijo();return}
  if(a==='elegirPerfil'){const p=(S.perfiles||[]).find(x=>x.id===id);if(p)sheetPin(p);return}
  if(a==='nuevoPerfil'){sheetNuevoPerfil();return}
  if(a==='reintentarPerfiles'){S.perfiles=null;render();cargarPerfiles();return}
  if(a==='cuenta'){sheetCuenta();return}
  if(a==='cambiarPerfil'){closeSheet(true);escribir(SKEY,null);S.view='inicio';S.ready=false;init();return}
  if(a==='conexion'){closeSheet(true);S.mode='setup';render();return}
  if(!S.ready)return;
  if(S.demo){
    if(['editMov','editFijo','editDeuda','toggleFijo','payDeuda','editIngreso','toggleIngreso','editMeta','toggleAhorro','aportar','sacar'].includes(a)){toast('Esto es un ejemplo. Toca “Empezar con mis datos”.');return}
    await salirDemo();
  }
  ({addMeta:()=>sheetMeta(),editMeta:()=>sheetMeta(id),toggleAhorro:()=>toggleAhorro(id),aportar:()=>sheetAhorroMov(null,id,'apartar'),sacar:()=>sheetAhorroMov(null,id,'sacar'),addIngresoFijo:()=>sheetIngresoFijo(),editIngreso:()=>sheetIngresoFijo(id),toggleIngreso:()=>toggleIngreso(id),addMov:()=>sheetMov(),editMov:()=>sheetMov(id),addFijo:()=>sheetFijo(),editFijo:()=>sheetFijo(id),toggleFijo:()=>toggleFijo(id),addDeuda:()=>sheetDeuda(),editDeuda:()=>sheetDeuda(id),payDeuda:()=>payDeuda(id)}[a]||(()=>{}))();
});

let tt;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400)}

init();
</script>
